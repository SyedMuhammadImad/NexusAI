name: Public snapshot verification
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m venv backend/.venv
      - run: ./backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-lock.txt
      - run: ./backend/.venv/Scripts/python.exe -B scripts/verify_public_snapshot.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run build
      - run: npm --prefix connectors/whatsapp ci --ignore-scripts
      - run: node --test connectors/whatsapp/bridge.test.mjs connectors/whatsapp/identity.test.mjs connectors/whatsapp/compatibility.test.mjs connectors/whatsapp/pair.test.mjs
  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend audit --audit-level=moderate
