version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TRADING_MODE=paper
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    restart: unless-stopped

  # Optional: TimescaleDB for time-series trade data
  # db:
  #   image: timescale/timescaledb:latest-pg16
  #   environment:
  #     POSTGRES_DB: hedgefund
  #     POSTGRES_USER: trader
  #     POSTGRES_PASSWORD: changeme_before_production
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
